<!DOCTYPE html>
<html>

<head>
    <title>Update Student</title>
</head>

<body>

    <h1>Update Student</h1>

    <form method="POST">

        <input type="text" name="name" value="{{ student[1] }}">

        <input type="number" name="age" value="{{ student[2] }}">

        <input type="text" name="course" value="{{ student[3] }}">

        <button type="submit">Update</button>

    </form>

</body>

</html>
